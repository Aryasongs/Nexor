<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexor Search</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23050A14'/%3E%3Cpath d='M7 2v11h3v9l7-12h-4l4-8z' fill='%2300C8FF'/%3E%3C/svg%3E">
<meta name="theme-color" content="#050A14">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#050A14; --surface:#0D1B2E; --surface2:#142236; --surface3:#1A2D45;
  --border:rgba(0,200,255,0.08); --border2:rgba(255,255,255,0.06);
  --text:#F0F4FF; --text2:rgba(240,244,255,0.55); --text3:rgba(240,244,255,0.3);
  --cyan:#00C8FF; --cyan-dim:rgba(0,200,255,0.12); --amber:#FFB830;
  --green:#00D68F; --like:#FF3B5C;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:'Inter',system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;-webkit-font-smoothing:antialiased;height:100%;overflow:hidden;}
button{border:none;background:none;cursor:pointer;color:inherit;font-family:inherit;outline:none;-webkit-tap-highlight-color:transparent;}
input{font-family:inherit;outline:none;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
.hidden{display:none!important;}
img{display:block;max-width:100%;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px;}

#boot-screen{position:fixed;inset:0;z-index:2000;background:radial-gradient(ellipse at 30% 20%,rgba(0,200,255,0.10) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(255,184,48,0.08) 0%,transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.boot-mark{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--cyan),#4FE3FF);display:flex;align-items:center;justify-content:center;box-shadow:0 0 48px rgba(0,200,255,0.4);animation:bootPulse 1.6s ease-in-out infinite;}
.boot-mark i{font-size:38px;color:#050A14;}
@keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.boot-name{font-size:20px;font-weight:800;letter-spacing:-.4px;}

#gate-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 20% 0%,rgba(0,200,255,0.14) 0%,transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(255,184,48,0.10) 0%,transparent 55%),var(--bg);}
.gate-card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(20,34,54,0.9),rgba(13,27,46,0.9));border:1px solid var(--border2);border-radius:26px;padding:32px 26px;text-align:center;box-shadow:0 28px 70px rgba(0,0,0,0.55);}
.gate-card .boot-mark{margin:0 auto 18px;}
.gate-card h1{font-size:20px;font-weight:800;margin-bottom:8px;}
.gate-card p{font-size:13.5px;color:var(--text2);line-height:1.5;margin-bottom:22px;}
.gate-btn{display:block;width:100%;padding:13px;border-radius:999px;background:linear-gradient(135deg,var(--cyan),#4FE3FF);color:#050A14;font-weight:800;font-size:14.5px;}

#app{position:fixed;inset:0;display:flex;}
.sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border2);display:flex;flex-direction:column;transition:transform .25s ease;}
.sidebar-top{padding:16px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#4FE3FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark i{font-size:18px;color:#050A14;}
.brand-name{font-weight:800;font-size:15.5px;flex:1;}
.back-to-sparks{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;}
.back-to-sparks:hover{color:var(--cyan);background:var(--surface2);}
.sidebar-section-label{padding:14px 16px 6px;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--text3);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
.sidebar-section-label span.clear{font-size:10.5px;text-transform:none;font-weight:700;color:var(--text3);cursor:pointer;}
.sidebar-section-label span.clear:hover{color:var(--like);}
.history-list{flex:1;overflow-y:auto;padding:0 10px 10px;}
.history-item{padding:9px 10px;border-radius:10px;font-size:13px;color:var(--text2);margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;}
.history-item span{overflow:hidden;text-overflow:ellipsis;}
.history-item i{font-size:14px;color:var(--text3);flex-shrink:0;}
.history-item:hover{background:var(--surface2);color:var(--text);}
.sidebar-bottom{padding:12px 14px 14px;border-top:1px solid var(--border2);font-size:11.5px;color:var(--text3);}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.topbar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border2);background:rgba(5,10,20,0.7);backdrop-filter:blur(10px);}
.menu-toggle{display:none;width:34px;height:34px;align-items:center;justify-content:center;border-radius:9px;font-size:19px;flex-shrink:0;}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:999px;padding:6px 6px 6px 16px;max-width:640px;}
.search-box:focus-within{border-color:rgba(0,200,255,0.35);}
.search-box i.leading{font-size:17px;color:var(--text3);}
.search-box input{flex:1;background:none;color:var(--text);font-size:14.5px;padding:8px 0;}
.search-box input::placeholder{color:var(--text3);}
.search-go{width:34px;height:34px;border-radius:50%;background:var(--cyan);color:#050A14;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.search-clear{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0;}
.search-clear:hover{color:var(--text);background:var(--surface3);}

.results-scroll{flex:1;overflow-y:auto;padding:18px 20px 40px;}
.results-inner{max-width:760px;margin:0 auto;}
.empty-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;gap:10px;color:var(--text2);}
.empty-hero .boot-mark{width:60px;height:60px;border-radius:16px;}
.empty-hero h2{font-size:19px;font-weight:800;color:var(--text);}
.suggest-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
.suggest-chip{padding:9px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border2);font-size:12.5px;color:var(--text2);}
.suggest-chip:hover{color:var(--cyan);border-color:var(--cyan-dim);}
#gcse-container{display:none;}
#gcse-container.show{display:block;}

.overlay-scrim{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:none;}
.overlay-scrim.show{display:block;}
#toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface3);color:var(--text);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,0.4);z-index:3000;opacity:0;transition:.25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:flex;}
}

/* ===== Google Custom Search — restyle to match Nexor dark theme ===== */
.gsc-control-cse{background:transparent!important;border:none!important;padding:0!important;font-family:inherit!important;}
.gsc-results .gsc-cursor-box{margin-top:10px!important;}
.gsc-webResult.gsc-result{background:var(--surface2)!important;border:1px solid var(--border2)!important;border-radius:14px!important;padding:14px!important;margin-bottom:12px!important;}
.gsc-webResult.gsc-result:hover{border-color:rgba(0,200,255,0.25)!important;}
.gs-webResult .gs-title, .gs-title, .gs-title a, .gs-title a *{color:var(--cyan)!important;text-decoration:none!important;font-weight:700!important;}
.gsc-url-top{padding:0!important;margin-bottom:4px!important;}
.gsc-url-top .gs-visibleUrl-breadcrumb, .gsc-url-top .gs-visibleUrl-short{color:var(--green)!important;font-size:12.5px!important;}
.gs-snippet, .gs-bidi-start-align.gs-snippet{color:var(--text2)!important;background:transparent!important;font-size:13.5px!important;line-height:1.5!important;}
.gs-favicon{border-radius:4px!important;margin-right:6px!important;}
.gsc-thumbnail-inside, .gsc-table-cell-thumbnail{padding:0!important;}
.gsc-cursor-page{color:var(--text2)!important;padding:4px 9px!important;}
.gsc-cursor-current-page{color:var(--cyan)!important;font-weight:800!important;}
.gsc-tabsArea{background:transparent!important;border:none!important;margin-bottom:14px!important;}
.gsc-tabHeader{color:var(--text2)!important;border:1px solid var(--border2)!important;background:var(--surface2)!important;border-radius:999px!important;margin-right:8px!important;padding:7px 15px!important;font-weight:700!important;font-size:13px!important;}
.gsc-tabHeader.gsc-tabdActive{background:var(--cyan-dim)!important;color:var(--cyan)!important;border-color:rgba(0,200,255,0.35)!important;}
.gcsc-find-more-on-google, .gcsc-find-more-on-google-root{color:var(--text3)!important;}
.gsc-imageResult{background:var(--surface2)!important;border-radius:12px!important;border:1px solid var(--border2)!important;}
.gs-image-box{background:var(--surface3)!important;border-radius:10px!important;}
.gsc-completion-container{background:var(--surface2)!important;border:1px solid var(--border2)!important;color:var(--text)!important;}
.gsc-completion-selected{background:var(--surface3)!important;}

/* ===== Search layout: results + knowledge panel side by side ===== */
.search-layout{display:flex;gap:24px;align-items:flex-start;}
#gcse-container{flex:1;min-width:0;}
#kg-panel{width:328px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border2);border-radius:18px;padding:20px;}
@media (max-width:900px){
  .search-layout{flex-direction:column;}
  #kg-panel{width:100%;order:-1;}
}

.kg-photo-main{width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface3);margin-bottom:10px;}
.kg-photo-main img{width:100%;height:100%;object-fit:cover;}
.kg-thumbs{display:flex;gap:6px;margin-bottom:16px;}
.kg-thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.kg-thumb.active{border-color:var(--cyan);}
.kg-thumb img{width:100%;height:100%;object-fit:cover;}
.kg-name{font-size:19px;font-weight:800;line-height:1.25;}
.kg-title{font-size:13px;color:var(--text2);margin-top:3px;margin-bottom:12px;}
.kg-overview{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:16px;}
.kg-facts-label{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.kg-fact-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--border2);font-size:12.5px;}
.kg-fact-row:last-child{border-bottom:none;}
.kg-fact-key{width:88px;flex-shrink:0;color:var(--text3);}
.kg-fact-val{color:var(--text2);line-height:1.45;}
.kg-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;background:var(--cyan-dim);color:var(--cyan);border-radius:6px;padding:3px 7px;margin-top:10px;}
</style>
</head>
<body>

<div id="boot-screen"><div class="boot-mark"><i class="ph-fill ph-magnifying-glass"></i></div><div class="boot-name">Nexor Search</div></div>

<div id="gate-screen" class="hidden">
  <div class="gate-card">
    <div class="boot-mark"><i class="ph-fill ph-magnifying-glass"></i></div>
    <h1>Nexor Search</h1>
    <p>Nexor Search use karne ke liye apne Nexor Sparks account se sign in karein.</p>
    <a class="gate-btn" href="index.html">Sign in on Nexor Sparks</a>
  </div>
</div>

<div id="app" class="hidden">
  <div class="overlay-scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand-mark"><i class="ph-fill ph-magnifying-glass"></i></div>
      <div class="brand-name">Nexor Search</div>
      <a class="back-to-sparks" href="index.html"><i class="ph ph-arrow-left"></i> Sparks</a>
    </div>
    <div class="sidebar-section-label">History <span class="clear" onclick="clearHistory()">Clear</span></div>
    <div class="history-list" id="history-list"></div>
    <div class="sidebar-bottom" id="user-email-label"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar(true)"><i class="ph ph-list"></i></button>
      <div class="search-box">
        <i class="ph ph-magnifying-glass leading"></i>
        <input id="search-input" type="text" placeholder="Nexor Search par kuch bhi dhoondo..." onkeydown="onSearchKeydown(event)">
        <button class="search-clear hidden" id="search-clear-btn" onclick="clearInput()"><i class="ph ph-x"></i></button>
        <button class="search-go" onclick="runSearch()"><i class="ph-fill ph-arrow-right"></i></button>
      </div>
    </div>

    <div class="results-scroll" id="results-scroll">
      <div class="results-inner">
        <div class="empty-hero" id="empty-hero">
          <div class="boot-mark"><i class="ph-fill ph-magnifying-glass"></i></div>
          <h2>Web par kuch bhi dhoondo</h2>
          <div style="font-size:13px">Websites, images aur videos — sab ek jagah.</div>
          <div class="suggest-row">
            <div class="suggest-chip" onclick="quickSearch('latest tech news')">latest tech news</div>
            <div class="suggest-chip" onclick="quickSearch('cricket scores today')">cricket scores today</div>
            <div class="suggest-chip" onclick="quickSearch('weather today')">weather today</div>
          </div>
        </div>
        <div class="search-layout">
          <div id="gcse-container"><div id="gcse-results"></div></div>
          <div id="kg-panel" class="hidden"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// FIREBASE INIT — same project as Nexor Sparks so login carries over
// ============================================================
const firebaseConfig = {
  apiKey:"AIzaSyC30TcmMVhP_8HdFYS1WufRiZwSDYNMTF0",
  authDomain:"pulse2-92372.firebaseapp.com",
  databaseURL:"https://pulse2-92372-default-rtdb.firebaseio.com",
  projectId:"pulse2-92372",
  storageBucket:"pulse2-92372.firebasestorage.app",
  messagingSenderId:"276235725177",
  appId:"1:276235725177:web:0f4e0789fae80a435927a8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let me = null;
let historyCache = {};
let gcseElement = null;
let gcseReady = false;

// ============================================================
// KNOWLEDGE GRAPH — curated panel shown next to results when a
// search query matches a known entity. Add more people/brands here
// by pushing another object with your own trigger keywords.
// ============================================================
const KNOWLEDGE_ENTITIES = [
  {
    triggers:['gursharan pooni','gursharan singh pooni','sharan pooni','shara pooni','g pooni','pooni nexor','nexor ceo','nexor founder','nexor sparks founder','nexor sparks ceo'],
    name:'Gursharan Singh Pooni',
    title:'Businessman, Founder & CEO of Nexor',
    images:[
      'https://aryasongs.github.io/Pulse/IMG_9590.jpeg',
      'https://aryasongs.github.io/Pulse/IMG_7683.jpeg',
      'https://aryasongs.github.io/Pulse/IMG_7492.jpeg',
      'https://aryasongs.github.io/Pulse/IMG_4960.png'
    ],
    overview:'Gursharan Singh Pooni is a businessman and former songwriter who is the CEO and largest shareholder of Nexor and Sparks.',
    facts:{
      'Born':'02 February 2006 (20 years), Banga, India',
      'Parents':'Gurdial Singh, Ranjit Kaur',
      'Education':'Google Developers Campus Program (2024), Punjab High School (2021)',
      'Siblings':'Ravinder Kaur',
      'Height':'1.88 m'
    }
  },
  {
    triggers:['anmol sunda','anmol sundas','sunda nexor','co founder nexor','nexor co founder'],
    name:'Anmol Sunda',
    title:'Co-founder of Nexor',
    images:[],
    overview:'Anmol Sunda is the co-founder of Nexor. Gursharan Singh Pooni (Sharan Pooni) has chosen him as his successor.',
    facts:{
      'Role':'Co-founder, Nexor',
      'Successor of':'Gursharan Singh Pooni (Sharan Pooni)'
    }
  },
  {
    triggers:['nexor','sparks','nexor sparks','what is nexor','what is sparks'],
    name:'Nexor',
    title:'Technology company · Social media platform',
    images:['https://aryasongs.github.io/Pulse/621954EC-539B-4CA6-8CBB-9172C2BBC445.png'],
    overview:'Nexor is a technology company that operates Sparks, a social media platform for sharing short updates called Pulses, along with Nexor AI and Nexor Search.',
    facts:{
      'Founder & CEO':'Gursharan Singh Pooni (Sharan Pooni)',
      'Products':'Sparks, Nexor AI, Nexor Search',
      'Type':'Technology company'
    }
  }
];
let kgActiveImages = [];

function normalizeQuery(q){ return String(q||'').toLowerCase().trim().replace(/\s+/g,' '); }
function findKnowledgeEntity(q){
  const nq = normalizeQuery(q);
  if(!nq) return null;
  for(const ent of KNOWLEDGE_ENTITIES){
    if(ent.triggers.some(t=>nq.includes(t))) return ent;
  }
  return null;
}
function renderKnowledgePanel(ent){
  const panel = document.getElementById('kg-panel');
  if(!ent){ panel.classList.add('hidden'); panel.innerHTML=''; return; }
  kgActiveImages = ent.images || [];
  const factsHtml = Object.entries(ent.facts||{}).map(([k,v])=>`
    <div class="kg-fact-row"><div class="kg-fact-key">${escapeHtml(k)}</div><div class="kg-fact-val">${escapeHtml(v)}</div></div>
  `).join('');
  let photoHtml = '';
  if(kgActiveImages.length){
    const thumbsHtml = kgActiveImages.length>1 ? kgActiveImages.map((src,i)=>`
      <div class="kg-thumb ${i===0?'active':''}" data-i="${i}" onclick="kgSelectImage(${i})"><img src="${src}" loading="lazy"></div>
    `).join('') : '';
    photoHtml = `
      <div class="kg-photo-main" id="kg-photo-main"><img id="kg-photo-main-img" src="${kgActiveImages[0]}" loading="lazy"></div>
      ${thumbsHtml ? `<div class="kg-thumbs" id="kg-thumbs">${thumbsHtml}</div>` : '<div style="margin-bottom:16px"></div>'}
    `;
  }
  panel.innerHTML = `
    ${photoHtml}
    <div class="kg-name">${escapeHtml(ent.name)}</div>
    <div class="kg-title">${escapeHtml(ent.title)}</div>
    <div class="kg-overview">${escapeHtml(ent.overview)}</div>
    <div class="kg-facts-label">Quick facts</div>
    ${factsHtml}
    <div class="kg-badge"><i class="ph-fill ph-check-circle"></i> Nexor Search Knowledge</div>
  `;
  panel.classList.remove('hidden');
}
function kgSelectImage(i){
  document.getElementById('kg-photo-main-img').src = kgActiveImages[i];
  document.querySelectorAll('#kg-thumbs .kg-thumb').forEach((el,idx)=>el.classList.toggle('active', idx===i));
}

auth.onAuthStateChanged(u=>{
  document.getElementById('boot-screen').classList.add('hidden');
  if(!u){
    document.getElementById('gate-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  me = u;
  document.getElementById('gate-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-email-label').textContent = u.email || u.displayName || '';
  loadHistory();
});

// ============================================================
// GOOGLE CUSTOM SEARCH ENGINE
// cx = b56298127c6924a8b (Nexor Search engine ID)
// We render only the results pane ("searchresults-only") and drive it
// from our own dark-themed search box via execute(query). Tabs for
// Images/Videos show up automatically here IF they're turned on in the
// CSE control panel at https://cse.google.com/cse?cx=b56298127c6924a8b
// (Setup → Search features → turn on Image search / add refinements).
// ============================================================
window.__gcse = {
  parsetags: 'explicit',
  callback: function(){
    gcseElement = google.search.cse.element.render({
      div: 'gcse-results',
      tag: 'searchresults-only',
      gname: 'nexorsearch',
      attributes: { linkTarget: '_blank' }
    });
    gcseReady = true;
    // if we arrived here already carrying a query (e.g. from history click before script loaded)
    if(window.__pendingQuery){ runSearch(window.__pendingQuery); window.__pendingQuery=null; }
  }
};
(function(){
  const s = document.createElement('script');
  s.src = 'https://cse.google.com/cse.js?cx=b56298127c6924a8b';
  s.async = true;
  document.head.appendChild(s);
})();

// ============================================================
// SEARCH FLOW
// ============================================================
function onSearchKeydown(e){ if(e.key==='Enter') runSearch(); }
function quickSearch(q){ document.getElementById('search-input').value=q; runSearch(q); }
function clearInput(){
  document.getElementById('search-input').value='';
  document.getElementById('search-clear-btn').classList.add('hidden');
  document.getElementById('search-input').focus();
}
document.getElementById('search-input').addEventListener('input', e=>{
  document.getElementById('search-clear-btn').classList.toggle('hidden', !e.target.value);
});

function runSearch(qOverride){
  const input = document.getElementById('search-input');
  const q = (qOverride!==undefined ? qOverride : input.value).trim();
  if(!q) return;
  input.value = q;
  document.getElementById('search-clear-btn').classList.remove('hidden');

  if(!gcseReady){ window.__pendingQuery = q; showToast('Search load ho raha hai, ek second...'); return; }

  document.getElementById('empty-hero').classList.add('hidden');
  document.getElementById('gcse-container').classList.add('show');
  gcseElement.execute(q);
  renderKnowledgePanel(findKnowledgeEntity(q));
  pushHistory(q);
  toggleSidebar(false);
}

// ============================================================
// SEARCH HISTORY (Firebase RTDB: nexorSearchHistory/{uid})
// ============================================================
function loadHistory(){
  db.ref(`nexorSearchHistory/${me.uid}`).orderByChild('ts').limitToLast(30).on('value', snap=>{
    historyCache = snap.val() || {};
    renderHistory();
  });
}
function renderHistory(){
  const list = document.getElementById('history-list');
  const entries = Object.entries(historyCache).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  list.innerHTML = entries.map(([id,h])=>`
    <div class="history-item" onclick="quickSearch('${escapeAttr(h.query)}')">
      <i class="ph ph-clock-counter-clockwise"></i><span>${escapeHtml(h.query)}</span>
    </div>`).join('') || '<div style="padding:10px;font-size:12px;color:var(--text3)">Abhi koi search history nahi</div>';
}
function pushHistory(q){
  // avoid pushing an exact duplicate of the most recent search
  const entries = Object.entries(historyCache).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  if(entries.length && entries[0][1].query===q) return;
  db.ref(`nexorSearchHistory/${me.uid}`).push({ query:q, ts:Date.now() });
}
function clearHistory(){
  db.ref(`nexorSearchHistory/${me.uid}`).remove();
}

// ============================================================
// SIDEBAR + UTIL
// ============================================================
function toggleSidebar(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('show', open);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return String(s).replace(/'/g,"\\'"); }

let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
</script>
