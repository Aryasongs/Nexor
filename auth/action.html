<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nexor Sparks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23050A14'/%3E%3Cpath d='M7 2v11h3v9l7-12h-4l4-8z' fill='%2300C8FF'/%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-action-screen">
  <div class="auth-brand" id="brand-mount"></div>
  <div class="auth-card" style="text-align:center;">
    <div class="state-icon-wrap"><div class="state-icon loading"><i class="ph ph-circle-notch spin"></i></div></div>
    <div class="state-title" id="route-title">Redirecting&hellip;</div>
    <div class="state-desc" id="route-desc">Please wait while we take you to the right page.</div>
  </div>
  <div class="auth-footer" id="footer-mount"></div>
</div>

<!-- Firebase compat SDK (must load before auth.js) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var N = window.NexorAuth;
  N.renderBrand(document.getElementById('brand-mount'), 'Account action');
  N.renderFooter(document.getElementById('footer-mount'));

  var params = N.getParams();

  // Map of Firebase's "mode" values to our branded pages.
  var ROUTES = {
    verifyEmail: 'verify-email.html',
    resetPassword: 'reset-password.html',
    recoverEmail: 'recover-email.html',
    verifyAndChangeEmail: 'change-email.html'
  };

  var target = ROUTES[params.mode];
  var titleEl = document.getElementById('route-title');
  var descEl = document.getElementById('route-desc');

  function fail(msg) {
    document.querySelector('.state-icon').className = 'state-icon error';
    document.querySelector('.state-icon').innerHTML = '<i class="ph ph-warning-circle"></i>';
    titleEl.textContent = 'Invalid link';
    descEl.textContent = msg;
  }

  if (!params.mode || !target) {
    fail('This link is missing required information or is not recognized. Please request a new link.');
    return;
  }
  if (!N.isPlausibleOobCode(params.oobCode)) {
    fail('This link is malformed or incomplete. Please request a new one from the app.');
    return;
  }

  // Forward the *exact* query string Firebase generated (mode, oobCode,
  // apiKey, lang, continueUrl) to the branded page responsible for it.
  // We don't rewrite continueUrl here — each destination page re-validates
  // it independently before ever using it.
  var forwardQuery = location.search; // includes leading "?"
  location.replace(target + forwardQuery);
})();
</script>
</body>
</html>
