<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Confirm New Email — Nexor Sparks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23050A14'/%3E%3Cpath d='M7 2v11h3v9l7-12h-4l4-8z' fill='%2300C8FF'/%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-action-screen">
  <div class="auth-brand" id="brand-mount"></div>

  <div class="auth-card" style="text-align:center;">
    <div id="view-loading">
      <div class="state-icon-wrap"><div class="state-icon loading"><i class="ph ph-circle-notch spin"></i></div></div>
      <div class="state-title">Confirming your new email&hellip;</div>
      <div class="state-desc">This will only take a moment.</div>
    </div>

    <div id="view-invalid" class="hidden">
      <div class="state-icon-wrap"><div class="state-icon error"><i class="ph ph-x-circle"></i></div></div>
      <div class="state-title">Link invalid or expired</div>
      <div class="state-desc" id="invalid-desc">This email change link is no longer valid.</div>
      <div class="btn-row"><a class="btn btn-secondary" href="#" id="btn-invalid-login">Go to Login</a></div>
    </div>

    <div id="view-success" class="hidden">
      <div class="state-icon-wrap"><div class="state-icon success"><i class="ph ph-check-circle"></i></div></div>
      <div class="state-title">Email address updated!</div>
      <div class="state-desc">Your Nexor Sparks account email has been changed to:</div>
      <div class="email-pill"><i class="ph ph-envelope-simple"></i><span id="new-email-text"></span></div>
      <div class="state-desc" style="margin-top:4px;">Use this new address the next time you log in.</div>
      <div class="btn-row"><a class="btn btn-primary" href="#" id="btn-continue-login">Continue to Login</a></div>
    </div>
  </div>

  <div class="auth-footer" id="footer-mount"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var N = window.NexorAuth;
  var auth = N.auth;

  N.renderBrand(document.getElementById('brand-mount'), 'Email change confirmation');
  N.renderFooter(document.getElementById('footer-mount'));
  document.getElementById('btn-invalid-login').href = N.LOGIN_URL;
  document.getElementById('btn-continue-login').href = N.LOGIN_URL;

  var views = {
    loading: document.getElementById('view-loading'),
    invalid: document.getElementById('view-invalid'),
    success: document.getElementById('view-success')
  };
  function show(name) {
    Object.keys(views).forEach(function (k) { views[k].classList.toggle('hidden', k !== name); });
  }

  var params = N.getParams();

  if (params.mode !== 'verifyAndChangeEmail' || !N.isPlausibleOobCode(params.oobCode)) {
    document.getElementById('invalid-desc').textContent = 'This link is malformed or incomplete. Please request a new one.';
    show('invalid');
    return;
  }

  var newEmail = null;

  auth.checkActionCode(params.oobCode)
    .then(function (info) {
      newEmail = (info && info.data && info.data.email) || '';
      return auth.applyActionCode(params.oobCode);
    })
    .then(function () {
      document.getElementById('new-email-text').textContent = newEmail || 'your new address';
      show('success');
    })
    .catch(function (err) {
      document.getElementById('invalid-desc').textContent = N.friendlyAuthError(err);
      show('invalid');
    });
})();
</script>
</body>
</html>
