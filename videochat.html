<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pulse — Live Video Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep: #120A22;
    --bg-mid: #1D1036;
    --purple: #7B2FF7;
    --purple-dim: #4A2A8C;
    --pink: #FF2E9A;
    --pink-hi: #FF63B8;
    --grad: linear-gradient(100deg, var(--purple), var(--pink));
    --glass: rgba(255,255,255,0.08);
    --glass-hi: rgba(255,255,255,0.14);
    --line: rgba(255,255,255,0.12);
    --text: #FFFFFF;
    --muted: rgba(255,255,255,0.62);
    --muted-dim: rgba(255,255,255,0.38);
    --live: #37E27B;
    --danger: #FF4D6A;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font-body);
    background: radial-gradient(ellipse 800px 600px at 20% -10%, rgba(123,47,247,0.35), transparent 55%),
                radial-gradient(ellipse 700px 600px at 100% 10%, rgba(255,46,154,0.22), transparent 55%),
                var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 10px; }

  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- top badge ---------- */
  .top-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(18,10,34,0.55);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 11.5px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .top-badge .beacon {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 8px 1px rgba(55,226,123,0.8);
  }

  .brand-mini {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
  }

  .brand-mini .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px -3px rgba(255,46,154,0.6);
  }

  /* ---------- screens ---------- */
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ===== SETUP SCREEN ===== */
  #setupScreen .video-wrap {
    position: relative;
    flex: 1;
    background: linear-gradient(160deg, #241540, #150A28);
    overflow: hidden;
  }

  #localVideo, #localVideoPip { width: 100%; height: 100%; object-fit: cover; display: block; }

  .video-empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: rgba(255,255,255,0.28);
    transition: opacity 0.3s var(--ease);
  }
  .video-empty span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.6px; color: rgba(255,255,255,0.35); }

  .float-controls {
    position: absolute;
    top: 60px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }

  .fab {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(18,10,34,0.5);
    backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s var(--ease);
  }
  .fab:hover { background: rgba(18,10,34,0.75); transform: translateY(-1px); }
  .fab.off { background: var(--danger); border-color: var(--danger); }
  .fab.small { width: 38px; height: 38px; }

  .bottom-sheet {
    background: linear-gradient(180deg, rgba(18,10,34,0), rgba(18,10,34,0.97) 30%);
    padding: 90px 18px 26px;
    margin-top: -90px;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .pref-row { display: flex; gap: 10px; }
  .pref-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }

  .pref-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted-dim);
    padding-left: 2px;
  }

  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }

  .pill {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s var(--ease);
  }
  .pill:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .pill.active {
    background: var(--grad);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 14px -4px rgba(255,46,154,0.65);
  }

  .gradient-btn {
    width: 100%;
    padding: 16px;
    border-radius: 30px;
    border: none;
    background: var(--grad);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 12px 30px -10px rgba(255,46,154,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.15s var(--ease), filter 0.15s var(--ease);
  }
  .gradient-btn:hover { filter: brightness(1.07); }
  .gradient-btn:active { transform: scale(0.98); }
  .gradient-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .safety-line {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted-dim);
    justify-content: center;
  }

  /* ===== SEARCHING SCREEN ===== */
  #searchingScreen {
    background: radial-gradient(ellipse 600px 500px at 50% 30%, rgba(255,46,154,0.35), transparent 60%), var(--bg-mid);
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
  }

  .close-btn {
    position: absolute; top: 18px; right: 18px;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--line);
    color: var(--text); font-size: 18px; line-height: 1;
    cursor: pointer; z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }

  .search-visual {
    position: relative;
    width: 220px; height: 220px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.25);
    animation: pulse-ring 2.6s var(--ease) infinite;
  }
  .r1 { width: 100%; height: 100%; animation-delay: 0s; }
  .r2 { width: 100%; height: 100%; animation-delay: 0.6s; }
  .r3 { width: 100%; height: 100%; animation-delay: 1.2s; }

  @keyframes pulse-ring {
    0%   { transform: scale(0.55); opacity: 0.9; }
    100% { transform: scale(1); opacity: 0; }
  }

  .avatar-center {
    position: relative;
    z-index: 3;
    width: 78px; height: 78px;
    border-radius: 50%;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px -8px rgba(255,46,154,0.7), 0 0 0 4px rgba(18,10,34,0.9);
  }

  .orbit {
    position: absolute;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--glass-hi);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.7);
    animation: float 3.6s ease-in-out infinite;
  }
  .o1 { top: 4px; left: 14px; animation-delay: 0s; }
  .o2 { bottom: 10px; left: -4px; animation-delay: 0.7s; }
  .o3 { top: 20px; right: -6px; animation-delay: 1.4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  #searchingScreen h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 8px;
    line-height: 1.35;
  }

  #searchingScreen p {
    margin: 0;
    font-size: 13.5px;
    color: var(--muted);
  }

  .connecting-label {
    margin-top: 28px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.6px;
    color: var(--pink-hi);
  }
  .connecting-label::after {
    content: "";
    display: inline-block;
    width: 6px; height: 6px; margin-left: 6px;
    border-radius: 50%;
    background: var(--pink-hi);
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.15;} }

  /* ===== CALL SCREEN ===== */
  #callScreen { background: #05030A; }

  .video-wrap-full { position: relative; flex: 1; overflow: hidden; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; display: block; }

  .top-progress {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--grad);
    z-index: 15;
  }

  .pip {
    position: absolute;
    top: 60px; right: 14px;
    width: 92px; height: 122px;
    border-radius: 16px;
    object-fit: cover;
    border: 1.5px solid var(--line);
    box-shadow: 0 10px 26px -8px rgba(0,0,0,0.6);
    z-index: 12;
    background: #150A28;
  }

  .call-top-controls {
    position: absolute; top: 60px; left: 14px;
    display: flex; flex-direction: column; gap: 9px;
    z-index: 12;
  }

  .call-bottom-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 60px 16px 22px;
    background: linear-gradient(180deg, rgba(5,3,10,0), rgba(5,3,10,0.92) 45%);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    z-index: 12;
  }

  .stranger-tag {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-mono);
    font-size: 12px;
    background: rgba(18,10,34,0.55);
    border: 1px solid var(--line);
    padding: 8px 13px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
  }
  .stranger-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

  .call-actions { display: flex; gap: 8px; }

  .pill-btn {
    padding: 12px 20px;
    border-radius: 24px;
    border: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .pill-btn.gradient { background: var(--grad); color: #fff; box-shadow: 0 8px 22px -8px rgba(255,46,154,0.65); }
  .pill-btn.danger { background: rgba(255,77,106,0.15); color: var(--danger); border: 1px solid rgba(255,77,106,0.35); }

  /* chat sheet */
  .chat-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 62%;
    background: rgba(15,9,28,0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    border-radius: 22px 22px 0 0;
    transform: translateY(100%);
    transition: transform 0.32s var(--ease);
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding: 10px 14px 14px;
  }
  .chat-sheet.open { transform: translateY(0); }

  .chat-handle {
    width: 40px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,0.25);
    margin: 4px auto 12px;
  }

  #messages {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding-right: 2px;
  }

  .msg {
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
    background: var(--glass);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.mine {
    align-self: flex-end;
    background: rgba(255,46,154,0.18);
    border: 1px solid rgba(255,46,154,0.35);
    border-bottom-right-radius: 4px;
    border-bottom-left-radius: 14px;
  }
  .msg .who {
    display: block; font-family: var(--font-mono); font-size: 9.5px;
    color: var(--muted-dim); margin-bottom: 2px; text-transform: uppercase;
  }

  .chatBox { display: flex; gap: 8px; margin-top: 10px; }

  input {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--glass);
    outline: none;
    padding: 12px 14px;
    border-radius: 20px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13.5px;
  }
  input::placeholder { color: var(--muted-dim); }
  input:focus { border-color: rgba(255,46,154,0.5); }

  .send-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: none; background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }

  .banned { filter: blur(70px); }
</style>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/nsfwjs@4.2.1"></script>
</head>

<body>

<div class="phone">

  <div class="brand-mini">
    <div class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></div>
    Pulse
  </div>
  <div class="top-badge"><span class="beacon"></span>AI Protected</div>

  <!-- ============ SETUP SCREEN ============ -->
  <section id="setupScreen" class="screen active">
    <div class="video-wrap">
      <div class="video-empty" id="localEmpty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 7l-7 5 7 5V7Z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <span>CAMERA OFF</span>
      </div>
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="float-controls">
        <button class="fab" id="micFab" onclick="toggleMic()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        </button>
        <button class="fab" id="camFab" onclick="toggleCamera()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7Z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <button class="fab" onclick="switchCamera()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-sheet">
      <div class="pref-row">
        <div class="pref-group">
          <span class="pref-label">Gender</span>
          <div class="pill-row" id="myGenderRow">
            <button type="button" class="pill" data-value="male">Male</button>
            <button type="button" class="pill" data-value="female">Female</button>
            <button type="button" class="pill" data-value="other">Other</button>
          </div>
        </div>
        <div class="pref-group">
          <span class="pref-label">Looking for</span>
          <div class="pill-row" id="lookingForRow">
            <button type="button" class="pill" data-value="female">Female</button>
            <button type="button" class="pill" data-value="male">Male</button>
            <button type="button" class="pill" data-value="any">Anyone</button>
          </div>
        </div>
      </div>

      <button class="gradient-btn" id="startBtn" onclick="startChat()">Start Search</button>
      <div class="safety-line">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 6v6c0 5 3.8 9 9 10 5.2-1 9-5 9-10V6l-9-4Z"/></svg>
        AI-moderated · violations result in a 7-day ban
      </div>
    </div>
  </section>

  <!-- ============ SEARCHING SCREEN ============ -->
  <section id="searchingScreen" class="screen">
    <button class="close-btn" onclick="stopChat()">✕</button>
    <div class="search-visual">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="orbit o1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
      <div class="orbit o2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
      <div class="orbit o3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
      <div class="avatar-center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
    </div>
    <h2>Please wait while we<br/>find you a stranger</h2>
    <p>It usually takes a few moments</p>
    <div class="connecting-label" id="searchStatus">Searching</div>
  </section>

  <!-- ============ CALL SCREEN ============ -->
  <section id="callScreen" class="screen">
    <div class="video-wrap-full">
      <div class="top-progress"></div>
      <div class="video-empty" id="remoteEmpty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span>CONNECTING VIDEO</span>
      </div>
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideoPip" class="pip" autoplay muted playsinline></video>

      <div class="call-top-controls">
        <button class="fab small" id="micFab2" onclick="toggleMic()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        </button>
        <button class="fab small" id="camFab2" onclick="toggleCamera()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7Z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <button class="fab small" onclick="reportUser()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </button>
        <button class="fab small" onclick="toggleChatSheet()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        </button>
      </div>

      <div class="call-bottom-bar">
        <div class="stranger-tag"><span class="dot"></span>Stranger</div>
        <div class="call-actions">
          <button class="pill-btn danger" onclick="stopChat()">End</button>
          <button class="pill-btn gradient" onclick="nextChat()">Next</button>
        </div>
      </div>

      <div class="chat-sheet" id="chatSheet">
        <div class="chat-handle" onclick="toggleChatSheet()"></div>
        <div id="messages"></div>
        <div class="chatBox">
          <input id="chatInput" placeholder="Type a message..." />
          <button class="send-btn" onclick="sendMessage()">

<script type="module">

  let myGender = "male";

    [setupScreen, searchingScreen, callScreen].forEach(s => s.classList.remove("active"));

      if (p.dataset.value === defaultValue) p.classList.add("active");

  function ipKeyOf(ip) { return ip ? ip.replace(/\./g, "_").replace(/:/g, "-") : null; }

  async function checkBan() {
    const now = Date.now();

    const userSnap = await get(ref(db, "bannedUsers/" + userId));
    if (userSnap.exists()) {
      const data = userSnap.val();
      if (data.expiresAt && data.expiresAt > now) {

        await remove(ref(db, "bannedUsers/" + userId));
      }
    }

    if (myIP) {
      const key = ipKeyOf(myIP);
      const ipSnap = await get(ref(db, "bannedIPs/" + key));
      if (ipSnap.exists()) {
        const data = ipSnap.val();
        if (data.expiresAt && data.expiresAt > now) {
          banned = true;
          const daysLeft = Math.ceil((data.expiresAt - now) / (24 * 60 * 60 * 1000));
          alert("This network/IP is banned for " + daysLeft + " more day(s). Reason: " + data.reason);
          return true;
        } else {
          await remove(ref(db, "bannedIPs/" + key));
        }
      }
    }

    banned = false;
    return false;
  }

  async function banUser(reason) {
    if (banned) return;
    banned = true;

    localVideo.classList.add("banned");
    remoteVideo.classList.add("banned");

    const now = Date.now();
    const expiresAt = now + BAN_DURATION_MS;

    await set(ref(db, "bannedUsers/" + userId), {
      userId, reason, time: serverTimestamp(), bannedAt: now, expiresAt
    });

    try {
      const res = await fetch(BAN_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Ban-Secret": BAN_SECRET },
        body: JSON.stringify({ userId, reason })
      });
      const data = await res.json();
      console.log("IP banned via Worker:", data);
    } catch (err) {
      console.error("Ban worker call failed, falling back to client IP:", err);
      if (myIP) {
        await set(ref(db, "bannedIPs/" + ipKeyOf(myIP)), {
          ip: myIP, userId, reason, time: serverTimestamp(), bannedAt: now, expiresAt
        });
      }
    }

    await push(ref(db, "moderationLogs"), {
      userId, ip: myIP || "unknown", roomId: roomId || "none", reason, time: serverTimestamp()
    });

    setTimeout(async () => {
      await stopChat();
      alert("You were banned for 7 days for inappropriate content.");
    }, 1200);
  }

  async function initMedia() {
    const constraints = {
      video: { facingMode: usingBackCamera ? "environment" : "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    };

    localStream = await navigator.mediaDevices.getUserMedia(constraints).catch(async () => {
      return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    });

    localVideo.srcObject = localStream;
    localVideoPip.srcObject = localStream;
    localEmpty.style.opacity = "0";
    startNSFWDetection();
  }

  function createPeerConnection() {
    pc = new RTCPeerConnection(servers);
    remoteStream = new MediaStream();
    remoteVideo.srcObject = remoteStream;

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      remoteEmpty.style.opacity = "0";
      showScreen("call");
    };

    pc.onicecandidate = event => {
      if (!event.candidate || !roomId) return;
      const path = isCreator ? `rooms/${roomId}/callerCandidates` : `rooms/${roomId}/calleeCandidates`;
      push(ref(db, path), event.candidate.toJSON());
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") showScreen("call");
      if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
        remoteEmpty.style.opacity = "1";
      }
    };
  }

  function isCompatible(myG, myP, otherG, otherP) {
    const iAccept = myP === "any" || myP === otherG;
    const theyAccept = otherP === "any" || otherP === myG;
    return iAccept && theyAccept;
  }

  async function startChat() {
    try {
      await fetchIP();
      if (await checkBan()) return;

      startBtn.disabled = true;
      startBtn.textContent = "Opening camera...";
      if (!localStream) await initMedia();

      showScreen("searching");
      status("Searching");

      const waitingSnap = await get(ref(db, "waitingUsers"));
      let matchedUser = null;

      if (waitingSnap.exists()) {
        const users = waitingSnap.val();
        for (let id in users) {
          if (id === userId) continue;
          const candidate = users[id];
          const candidateGender = candidate.gender || "other";
          const candidatePref = candidate.lookingFor || "any";
          if (isCompatible(myGender, lookingFor, candidateGender, candidatePref)) {
            matchedUser = id;
            break;
          }
        }
      }

      if (matchedUser) {
        isCreator = false;
        roomId = "room_" + Math.random().toString(36).substring(2, 14);

        await remove(ref(db, "waitingUsers/" + matchedUser));
        await set(ref(db, "rooms/" + roomId), {
          users: { [matchedUser]: true, [userId]: true }, createdAt: serverTimestamp()
        });
        await set(ref(db, "matchedRooms/" + matchedUser), roomId);
        await set(ref(db, "matchedRooms/" + userId), roomId);

        createPeerConnection();
        await createAnswerFlow();
      } else {
        isCreator = true;

        await set(ref(db, "waitingUsers/" + userId), {
          gender: myGender, lookingFor: lookingFor, createdAt: serverTimestamp()
        });

        onDisconnect(ref(db, "waitingUsers/" + userId)).remove();

        onValue(ref(db, "matchedRooms/" + userId), async snap => {
          if (snap.exists() && !roomId) {
            roomId = snap.val();
            await remove(ref(db, "waitingUsers/" + userId));
            createPeerConnection();
            await createOfferFlow();
          }
        });

        status("Waiting for a match");
      }

      startBtn.disabled = false;
      startBtn.textContent = "Start Search";
    } catch (err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = "Start Search";
      showScreen("setup");
      alert("Error: " + err.message);
    }
  }

  async function createOfferFlow() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await set(ref(db, `rooms/${roomId}/offer`), { type: offer.type, sdp: offer.sdp });

    onValue(ref(db, `rooms/${roomId}/answer`), async snap => {
      if (snap.exists() && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
      }
    });

    listenCandidates("calleeCandidates");
    listenMessages();
  }

  async function createAnswerFlow() {
    onValue(ref(db, `rooms/${roomId}/offer`), async snap => {
      if (snap.exists() && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await set(ref(db, `rooms/${roomId}/answer`), { type: answer.type, sdp: answer.sdp });
      }
    });

    listenCandidates("callerCandidates");
    listenMessages();
  }

  function listenCandidates(path) {
    onChildAdded(ref(db, `rooms/${roomId}/${path}`), async snap => {
      try { await pc.addIceCandidate(new RTCIceCandidate(snap.val())); }
      catch (err) { console.error(err); }
    });
  }

  function listenMessages() {
    messagesBox.innerHTML = "";
    onChildAdded(ref(db, `rooms/${roomId}/messages`), snap => {
      const data = snap.val();
      const mine = data.from === userId;
      const div = document.createElement("div");
      div.className = "msg" + (mine ? " mine" : "");
      div.innerHTML = `<span class="who">${mine ? "You" : "Stranger"}</span>${escapeHtml(data.text)}`;
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    });
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.innerText = str;
    return d.innerHTML;
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || !roomId || banned) return;
    await push(ref(db, `rooms/${roomId}/messages`), { from: userId, text, time: serverTimestamp() });
    chatInput.value = "";
  }
  chatInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  function toggleChatSheet() {
    chatSheet.classList.toggle("open");
  }

  async function stopChat() {
    try {
      if (pc) { pc.close(); pc = null; }
      if (roomId) {
        await remove(ref(db, "rooms/" + roomId));
        await remove(ref(db, "matchedRooms/" + userId));
      }
      await remove(ref(db, "waitingUsers/" + userId));

      roomId = null;
      remoteVideo.srcObject = null;
      remoteEmpty.style.opacity = "1";
      messagesBox.innerHTML = "";
      chatSheet.classList.remove("open");

      showScreen("setup");
    } catch (err) { console.error(err); }
  }

  async function nextChat() {
    if (banned) return;
    await stopChat();
    setTimeout(startChat, 700);
  }

  function toggleMic() {
    if (!localStream) return;
    micOn = !micOn;
    localStream.getAudioTracks().forEach(track => track.enabled = micOn);
    document.querySelectorAll("#micFab, #micFab2").forEach(b => b.classList.toggle("off", !micOn));
  }

  function toggleCamera() {
    if (!localStream) return;
    cameraOn = !cameraOn;
    localStream.getVideoTracks().forEach(track => track.enabled = cameraOn);
    localEmpty.style.opacity = cameraOn ? "0" : "1";
    document.querySelectorAll("#camFab, #camFab2").forEach(b => b.classList.toggle("off", !cameraOn));
  }

  async function switchCamera() {
    try {
      if (!localStream) { usingBackCamera = !usingBackCamera; await initMedia(); return; }

      usingBackCamera = !usingBackCamera;
      const newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingBackCamera ? "environment" : "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });

      const newVideoTrack = newStream.getVideoTracks()[0];
      const newAudioTrack = newStream.getAudioTracks()[0];

      if (pc) {
        const videoSender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (videoSender) await videoSender.replaceTrack(newVideoTrack);
        const audioSender = pc.getSenders().find(s => s.track && s.track.kind === "audio");
        if (audioSender && newAudioTrack) await audioSender.replaceTrack(newAudioTrack);
      }

      localStream.getTracks().forEach(track => track.stop());
      localStream = newStream;
      localVideo.srcObject = newStream;
      localVideoPip.srcObject = newStream;
    } catch (err) {
      console.error(err);
    }
  }

  async function reportUser() {
    if (!roomId) { alert("No active stranger to report."); return; }
    await push(ref(db, "reports"), {
      roomId, reporter: userId, reporterIP: myIP || "unknown",

  function startNSFWDetection() {
    if (nsfwInterval) clearInterval(nsfwInterval);
    nsfwInterval = setInterval(async () => {
      if (!nsfwModel || !localVideo || banned) return;
      if (localVideo.readyState < 2) return;

        const porn = predictions.find(p => p.className === "Porn")?.probability || 0;
        const hentai = predictions.find(p => p.className === "Hentai")?.probability || 0;

    }, 2000);
  }

  window.startChat = startChat;
  window.nextChat = nextChat;
  window.stopChat = stopChat;
  window.sendMessage = sendMessage;
  window.toggleMic = toggleMic;
  window.toggleCamera = toggleCamera;
  window.switchCamera = switchCamera;
  window.reportUser = reportUser;
  window.toggleChatSheet = toggleChatSheet;

  window.addEventListener("beforeunload", () => {
    remove(ref(db, "waitingUsers/" + userId));
    remove(ref(db, "matchedRooms/" + userId));
