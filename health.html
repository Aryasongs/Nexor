<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexor Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#090b0f;
  --surface:#12151b;
  --surface2:#1a1f28;
  --border:#232936;
  --violet:#7c6cf0;
  --cyan:#2ad9c2;
  --coral:#ff6b5d;
  --amber:#f5b942;
  --text:#eef1f5;
  --muted:#8b93a1;
  --muted2:#5c6472;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#232936;border-radius:4px;}

/* ---------- AUTH SCREEN ---------- */
#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  padding:24px;
}
#authScreen::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(600px 400px at 15% 20%, rgba(124,108,240,0.16), transparent 60%),
    radial-gradient(600px 400px at 85% 80%, rgba(42,217,194,0.12), transparent 60%);
  pointer-events:none;
}
.auth-card{
  position:relative;
  width:100%;
  max-width:400px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px 32px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
}
.pulse-mark{width:34px;height:34px;flex-shrink:0;}
.brand-name{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
.auth-card h2{font-size:20px;margin-bottom:6px;font-weight:600;}
.auth-sub{color:var(--muted);font-size:13.5px;margin-bottom:24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.field input{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 13px;
  color:var(--text);
  font-size:14.5px;
  outline:none;
  transition:border-color .15s;
}
.field input:focus{border-color:var(--violet);}
.btn-primary{
  width:100%;
  background:linear-gradient(135deg,var(--violet),#5a4bd6);
  color:#fff;
  padding:12px;
  border-radius:10px;
  font-weight:600;
  font-size:14.5px;
  margin-top:6px;
  transition:opacity .15s, transform .1s;
}
.btn-primary:hover{opacity:0.92;}
.btn-primary:active{transform:scale(0.98);}
.auth-toggle{
  text-align:center;
  margin-top:18px;
  font-size:13.5px;
  color:var(--muted);
}
.auth-toggle span{color:var(--cyan);font-weight:600;cursor:pointer;}
.auth-error{
  color:var(--coral);
  font-size:13px;
  margin-top:10px;
  min-height:16px;
}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:248px;
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:24px 18px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar .brand{margin-bottom:30px;padding-left:4px;}
.sidebar .brand-name{font-size:18px;}
.user-chip{
  display:flex;
  align-items:center;
  gap:11px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 12px;
  margin-bottom:22px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:#0a0a0a;flex-shrink:0;
}
.user-chip .uname{font-size:13.5px;font-weight:600;line-height:1.2;}
.user-chip .uemail{font-size:11px;color:var(--muted);line-height:1.3;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav button{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;
  font-size:14px;color:var(--muted);font-weight:500;
  transition:background .12s, color .12s;
  text-align:left;width:100%;
}
.nav button:hover{background:var(--surface2);color:var(--text);}
.nav button.active{background:rgba(124,108,240,0.14);color:var(--violet);}
.nav-icon{width:18px;height:18px;flex-shrink:0;}
.signout{
  font-size:12.5px;color:var(--muted2);padding:10px 12px;
  border-top:1px solid var(--border);margin-top:10px;padding-top:16px;
}
.signout:hover{color:var(--coral);}

.main{flex:1;min-width:0;padding:28px 34px 80px;max-width:1180px;}
.page-header{margin-bottom:26px;}
.page-header h1{font-size:26px;font-weight:700;letter-spacing:-0.01em;}
.page-header p{color:var(--muted);font-size:13.5px;margin-top:4px;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(max-width:860px){.grid{grid-template-columns:1fr;}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  position:relative;
}
.card.wide{grid-column:1/-1;}
.card-head{
  display:flex;align-items:center;justify-content:between;gap:8px;
  margin-bottom:14px;
}
.card-title{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
}
.card-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.card-edit{
  margin-left:auto;font-size:11.5px;color:var(--muted2);
  border:1px solid var(--border);padding:4px 10px;border-radius:20px;
  transition:all .12s;
}
.card-edit:hover{color:var(--text);border-color:var(--violet);}
.card-note{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}

/* activity rings */
.rings-row{display:flex;align-items:center;gap:26px;}
.rings-stats{flex:1;display:flex;flex-direction:column;gap:10px;}
.ring-stat{display:flex;align-items:center;gap:9px;font-size:13px;}
.ring-stat .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.ring-stat b{font-family:'IBM Plex Mono',monospace;font-weight:500;}
.ring-stat .lbl{color:var(--muted);}

.metric-big{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-0.01em;}
.metric-unit{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px;}
.metric-sub{font-size:12px;color:var(--muted2);margin-top:2px;}

.workout-row{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.workout-row:last-child{border-bottom:none;}
.wo-icon{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);font-size:15px;
}
.wo-name{font-size:13.5px;font-weight:600;}
.wo-date{font-size:11.5px;color:var(--muted2);}
.wo-dur{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--cyan);}
.wo-del{color:var(--muted2);font-size:16px;padding:2px 6px;}
.wo-del:hover{color:var(--coral);}

.ecg-row{background:var(--surface2);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
.ecg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ecg-badge{font-size:13px;font-weight:600;}
.ecg-badge.ok{color:var(--cyan);}
.ecg-badge.bad{color:var(--coral);}
.ecg-date{font-size:11.5px;color:var(--muted2);}
.ecg-bpm{font-size:12px;color:var(--muted);}
.ecg-row:last-child{margin-bottom:0;}

.hl-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.hl-row:last-child{border-bottom:none;}
.hl-label{color:var(--muted);display:flex;align-items:center;gap:8px;}
.hl-val{font-family:'IBM Plex Mono',monospace;font-weight:500;}

canvas{max-width:100%;}

.empty-hint{color:var(--muted2);font-size:12.5px;font-style:italic;}

/* modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(6,7,10,0.72);
  align-items:center;justify-content:center;z-index:100;padding:20px;
  backdrop-filter:blur(3px);
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:26px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;
}
.modal h3{font-size:17px;margin-bottom:16px;font-weight:600;}
.modal .field label{font-size:11px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn-ghost{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
  color:var(--muted);font-size:13.5px;font-weight:500;
}
.btn-ghost:hover{color:var(--text);}
.modal .btn-primary{flex:1;margin-top:0;}

/* pulse divider */
.pulse-divider{width:100%;height:26px;opacity:0.5;margin:6px 0 22px;}

/* live tracking */
.live-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.live-stat{background:var(--surface2);border-radius:12px;padding:14px;text-align:center;}
.live-stat .lv{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
.live-stat .ll{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
.btn-track{
  padding:13px 22px;border-radius:12px;font-weight:600;font-size:14.5px;
  background:linear-gradient(135deg,var(--coral),#e0483a);color:#fff;
}
.btn-track.stop{background:var(--surface2);border:1px solid var(--coral);color:var(--coral);}
.btn-track:disabled{opacity:0.5;cursor:not-allowed;}
.perm-note{font-size:12px;color:var(--muted2);margin-top:10px;line-height:1.5;}
.hr-video-wrap{
  width:100%;max-width:220px;aspect-ratio:1;border-radius:16px;overflow:hidden;
  background:#000;position:relative;margin:0 auto 14px;border:2px solid var(--border);
}
.hr-video-wrap video{width:100%;height:100%;object-fit:cover;}
.hr-video-wrap.active{border-color:var(--coral);}
.hr-finger-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.55);color:#fff;font-size:12px;text-align:center;padding:14px;}
.hr-result{text-align:center;margin-top:14px;}
.hr-result .bpm-big{font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:700;color:var(--coral);}
.waveform-canvas{width:100%;height:70px;margin-top:10px;background:var(--surface2);border-radius:10px;}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center;}

/* heart rate detail — Apple Health style */
.range-tabs{
  display:flex;background:var(--surface2);border-radius:20px;padding:3px;
  margin-bottom:16px;overflow-x:auto;
}
.range-tab{
  flex:1;text-align:center;padding:7px 10px;border-radius:16px;
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.range-tab.active{background:#333a47;color:#fff;}
.avg-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.avg-row{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
.avg-big{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;}
.avg-unit{font-size:15px;color:var(--muted);font-weight:500;}
.avg-daterange{font-size:12.5px;color:var(--muted2);margin-bottom:14px;}
.about-card{
  background:var(--surface2);border-radius:14px;padding:16px;margin-top:16px;
  font-size:13px;line-height:1.65;color:#c7cbd3;
}
.about-card h4{font-size:15px;margin-bottom:10px;color:var(--text);font-weight:600;}
.about-card p+p{margin-top:10px;}
.hr-log-btn{
  font-size:12px;color:var(--cyan);border:1px solid var(--border);
  padding:5px 12px;border-radius:20px;margin-left:auto;
}
.section-heading-row{display:flex;align-items:center;margin-bottom:14px;}
.section-heading-row h3{font-size:16px;font-weight:600;}
.ecg-card{
  background:var(--surface2);border-radius:14px;padding:15px 16px;margin-bottom:12px;
}
.ecg-card:last-child{margin-bottom:0;}
.ecg-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.ecg-title{font-size:14.5px;font-weight:600;}
.ecg-title.poor{color:var(--coral);}
.ecg-title.ok{color:#e5e8ec;}
.ecg-datetime{font-size:12px;color:var(--muted2);}
.ecg-bpm-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:6px 0 10px;}
.ecg-canvas{width:100%;height:90px;display:block;border-radius:8px;}
.no-data-box{
  padding:40px 10px;text-align:center;color:var(--muted2);font-size:13.5px;
}

/* mobile topbar */
.mobile-topbar{display:none;}
@media(max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:60;
    transform:translateX(-100%);transition:transform .2s;
  }
  .sidebar.open{transform:translateX(0);}
  .mobile-topbar{
    display:flex;align-items:center;gap:12px;padding:16px 18px;
    border-bottom:1px solid var(--border);position:sticky;top:0;
    background:var(--bg);z-index:50;
  }
  .main{padding:20px 16px 70px;}
  .overlay-dim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:55;}
  .overlay-dim.show{display:block;}
}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <svg class="pulse-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
        <path d="M4 20H12L15 10L20 30L24 16L27 20H36" stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#7c6cf0"/><stop offset="1" stop-color="#2ad9c2"/></linearGradient></defs>
      </svg>
      <div class="brand-name">Nexor Health</div>
    </div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="auth-sub" id="authSub">Sign in to view your health summary.</p>

    <div class="field" id="nameField" style="display:none;">
      <label>Name</label>
      <input type="text" id="nameInput" placeholder="Your name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="authSubmit">Sign In</button>
    <div class="auth-error" id="authError"></div>
    <div class="auth-toggle" id="authToggle">
      Don't have an account? <span id="toggleLink">Create one</span>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="overlay-dim" id="overlayDim"></div>
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="pulse-mark" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="19" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>
          <path d="M4 20H12L15 10L20 30L24 16L27 20H36" stroke="url(#g2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <defs><linearGradient id="g2" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#7c6cf0"/><stop offset="1" stop-color="#2ad9c2"/></linearGradient></defs>
        </svg>
        <div class="brand-name">Nexor Health</div>
      </div>
      <div class="user-chip">
        <div class="avatar" id="avatarInitial">S</div>
        <div>
          <div class="uname" id="sideUserName">—</div>
          <div class="uemail" id="sideUserEmail">—</div>
        </div>
      </div>
      <div class="nav">
        <button class="nav-item active" data-page="summary">📋 &nbsp;Summary</button>
        <button class="nav-item" data-page="live">📡 &nbsp;Live Tracking</button>
        <button class="nav-item" data-page="heart">❤️ &nbsp;Heart</button>
        <button class="nav-item" data-page="trends">📈 &nbsp;Trends</button>
        <button class="nav-item" data-page="highlights">✨ &nbsp;Highlights</button>
      </div>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>

    <div style="flex:1;min-width:0;">
      <div class="mobile-topbar">
        <button id="menuBtn" style="font-size:20px;">☰</button>
        <div class="brand-name" style="font-size:16px;">Nexor Health</div>
      </div>
      <div class="main" id="mainContent"></div>
    </div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ---------------- FIREBASE ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyC30TcmMVhP_8HdFYS1WufRiZwSDYNMTF0",
  authDomain: "pulse2-92372.firebaseapp.com",
  databaseURL: "https://pulse2-92372-default-rtdb.firebaseio.com",
  projectId: "pulse2-92372",
  storageBucket: "pulse2-92372.firebasestorage.app",
  messagingSenderId: "276235725177",
  appId: "1:276235725177:web:0f4e0789fae80a435927a8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let userData = null; // cached snapshot of users/{uid}
let isSignUpMode = false;

/* ---------------- AUTH UI ---------------- */
const authTitle = document.getElementById('authTitle');
const authSub = document.getElementById('authSub');
const nameField = document.getElementById('nameField');
const authSubmit = document.getElementById('authSubmit');
const authToggle = document.getElementById('authToggle');
const toggleLink = document.getElementById('toggleLink');
const authError = document.getElementById('authError');

function handleToggleClick() {
  isSignUpMode = !isSignUpMode;
  authError.textContent = '';
  if (isSignUpMode) {
    authTitle.textContent = 'Create your account';
    authSub.textContent = 'Start tracking your health with Nexor.';
    nameField.style.display = 'block';
    authSubmit.textContent = 'Create Account';
    authToggle.innerHTML = 'Already have an account? <span id="toggleLink">Sign in</span>';
  } else {
    authTitle.textContent = 'Welcome back';
    authSub.textContent = 'Sign in to view your health summary.';
    nameField.style.display = 'none';
    authSubmit.textContent = 'Sign In';
    authToggle.innerHTML = "Don't have an account? <span id=\"toggleLink\">Create one</span>";
  }
  document.getElementById('toggleLink').addEventListener('click', handleToggleClick, { once:true });
}
toggleLink.addEventListener('click', handleToggleClick, { once:true });

authSubmit.addEventListener('click', async () => {
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const name = document.getElementById('nameInput').value.trim();
  authError.textContent = '';
  if (!email || !pass) { authError.textContent = 'Please enter email and password.'; return; }
  authSubmit.textContent = 'Please wait...';
  try {
    if (isSignUpMode) {
      if (!name) { authError.textContent = 'Please enter your name.'; authSubmit.textContent='Create Account'; return; }
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await db.ref('users/' + cred.user.uid + '/profile').set({ name, email });
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  } catch (e) {
    authError.textContent = e.message.replace('Firebase: ', '');
    authSubmit.textContent = isSignUpMode ? 'Create Account' : 'Sign In';
  }
});

document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

/* ---------------- AUTH STATE ---------------- */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    let profileSnap = await db.ref('users/' + user.uid + '/profile').get();

}

/* ---------------- ACTIVITY RING RENDER ---------------- */
function ringSVG(move, moveGoal, ex, exGoal, stand, standGoal) {
  const r1=42,r2=34,r3=26;
  const c1=2*Math.PI*r1, c2=2*Math.PI*r2, c3=2*Math.PI*r3;
  const p1=Math.min(move/Math.max(moveGoal,1),1), p2=Math.min(ex/Math.max(exGoal,1),1), p3=Math.min(stand/Math.max(standGoal,1),1);
  return `<svg width="118" height="118" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="${r1}" fill="none" stroke="#2a1418" stroke-width="8"/>
    <circle cx="50" cy="50" r="${r1}" fill="none" stroke="#ff6b5d" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c1}" stroke-dashoffset="${c1*(1-p1)}" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="${r2}" fill="none" stroke="#16281a" stroke-width="8"/>
    <circle cx="50" cy="50" r="${r2}" fill="none" stroke="#8ee04a" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c2}" stroke-dashoffset="${c2*(1-p2)}" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="${r3}" fill="none" stroke="#0d2a30" stroke-width="8"/>
    <circle cx="50" cy="50" r="${r3}" fill="none" stroke="#2ad9c2" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c3}" stroke-dashoffset="${c3*(1-p3)}" transform="rotate(-90 50 50)"/>
  </svg>`;
}

let hrRange = 'Y';

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildHRSeries(range) {
  const historyObj = d('heart.hrHistory', {}) || {};
  const history = Object.values(historyObj).filter(h => h && typeof h.bpm === 'number' && h.ts);
  const nowMs = Date.now();
  let bucketCount, bucketMs;
  if (range === 'D') { bucketCount = 8; bucketMs = 3 * 3600 * 1000; }
  else if (range === 'W') { bucketCount = 7; bucketMs = 24 * 3600 * 1000; }
  else if (range === 'M') { bucketCount = 30; bucketMs = 24 * 3600 * 1000; }
  else if (range === '6M') { bucketCount = 6; bucketMs = 30 * 24 * 3600 * 1000; }
  else { bucketCount = 12; bucketMs = 30 * 24 * 3600 * 1000; }

  const buckets = new Array(bucketCount).fill(null).map(() => ({ sum: 0, n: 0 }));
  history.forEach(h => {
    const age = nowMs - h.ts;
    const idx = bucketCount - 1 - Math.floor(age / bucketMs);
    if (idx >= 0 && idx < bucketCount) { buckets[idx].sum += h.bpm; buckets[idx].n++; }
  });

  const labels = [], values = [];
  const monthLetters = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const dayLetters = ['S','M','T','W','T','F','S'];
  for (let i = 0; i < bucketCount; i++) {
    const bucketDt = new Date(nowMs - (bucketCount - 1 - i) * bucketMs);
    let label;
    if (range === 'D') { const h12 = bucketDt.getHours() % 12 || 12; label = h12 + (bucketDt.getHours() < 12 ? 'AM' : 'PM'); }
    else if (range === 'W') label = dayLetters[bucketDt.getDay()];
    else if (range === 'M') label = bucketDt.getDate();
    else label = monthLetters[bucketDt.getMonth()];
    labels.push(label);
    values.push(buckets[i].n > 0 ? Math.round(buckets[i].sum / buckets[i].n) : null);
  }
  const realVals = values.filter(v => v != null);
  const avg = realVals.length ? Math.round(realVals.reduce((a,b)=>a+b,0) / realVals.length) : null;
  const firstIdx = values.findIndex(v => v != null);
  const lastIdx = values.length - 1 - [...values].reverse().findIndex(v => v != null);
  let dateRangeStr = '';
  if (firstIdx >= 0) {
    const firstDt = new Date(nowMs - (bucketCount - 1 - firstIdx) * bucketMs);
    const lastDt = new Date(nowMs - (bucketCount - 1 - lastIdx) * bucketMs);
    const opts = { month: 'short', year: 'numeric' };
    dateRangeStr = firstIdx === lastIdx ? firstDt.toLocaleDateString('en-US', opts)
      : firstDt.toLocaleDateString('en-US', opts) + ' – ' + lastDt.toLocaleDateString('en-US', opts);
  }
  return { labels, values, avg, dateRangeStr };
}

function drawEcgWave(canvas, seedNum, poor) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const x = w * i / 4;
    ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, h - 4); ctx.stroke();
  }
  const rand = mulberry32(seedNum);
  ctx.strokeStyle = poor ? '#ff6b5d' : '#ff5a6e';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  const midY = h * 0.55, scaleY = h * 0.42;
  if (poor) {
    let y = midY;
    for (let x = 0; x <= w; x += 2) {
      y += (rand() - 0.5) * h * 0.32;
      y = Math.max(h * 0.06, Math.min(h * 0.94, y));
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  } else {
    const beats = 4.3, period = w / beats;
    for (let x = 0; x <= w; x += 1.5) {
      const phase = (x % period) / period;
      let y = 0;
      y += 0.12 * Math.exp(-Math.pow((phase - 0.15) / 0.045, 2));
      y -= 0.15 * Math.exp(-Math.pow((phase - 0.30) / 0.012, 2));
      y += 1.0 * Math.exp(-Math.pow((phase - 0.335) / 0.010, 2));
      y -= 0.35 * Math.exp(-Math.pow((phase - 0.365) / 0.014, 2));
      y += 0.22 * Math.exp(-Math.pow((phase - 0.62) / 0.06, 2));
      y += (rand() - 0.5) * 0.02;
      const py = midY - y * scaleY;
      x === 0 ? ctx.moveTo(x, py) : ctx.lineTo(x, py);
    }
  }
  ctx.stroke();
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = Math.imul(31, h) + s.charCodeAt(i) | 0; }
  return h;
}

/* =========================================================
   LIVE TRACKING — REAL SENSORS
   1) Workout: GPS (Geolocation) + accelerometer (DeviceMotion) step counter
   2) Heart Rate: rear camera PPG (color-intensity of fingertip over lens)
   ========================================================= */

// ---- Workout tracking state ----
let wkActive = false, wkWatchId = null, wkStartTs = 0, wkTimerId = null;
let wkLastPos = null, wkDistanceM = 0, wkSteps = 0;
let wkLastStepTs = 0, wkAccelBuffer = [];

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function handleMotionStep(ev) {
  const g = ev.accelerationIncludingGravity || ev.acceleration;
  if (!g) return;
  const mag = Math.sqrt((g.x||0)**2 + (g.y||0)**2 + (g.z||0)**2);
  wkAccelBuffer.push(mag);
  if (wkAccelBuffer.length > 6) wkAccelBuffer.shift();
  const avg = wkAccelBuffer.reduce((a,b)=>a+b,0) / wkAccelBuffer.length;
  const now = Date.now();
  // peak-detection pedometer: crossing above ~12.5 m/s^2 with min 300ms gap between steps
  if (mag - avg > 2.2 && mag > 11.5 && (now - wkLastStepTs) > 300) {
    wkLastStepTs = now;
    wkSteps++;
    updateWkStatsUI();
  }
}

function updateWkStatsUI() {
  const durEl = document.getElementById('wkDuration');
  const distEl = document.getElementById('wkDistance');
  const stepEl = document.getElementById('wkSteps');
  const paceEl = document.getElementById('wkPace');
  if (!durEl) return;
  const elapsedSec = Math.floor((Date.now() - wkStartTs)/1000);
  const mm = String(Math.floor(elapsedSec/60)).padStart(2,'0');
  const ss = String(elapsedSec%60).padStart(2,'0');
  durEl.textContent = `${mm}:${ss}`;
  const miles = wkDistanceM / 1609.34;
  distEl.textContent = miles.toFixed(2);
  stepEl.textContent = wkSteps;
  const pace = miles > 0.02 ? (elapsedSec/60) / miles : 0;
  paceEl.textContent = pace > 0 ? pace.toFixed(1) + ' min/mi' : '—';
}

async function startWorkout() {
  if (!navigator.geolocation) { alert('Geolocation not supported on this device/browser.'); return; }
  // iOS 13+ requires explicit motion permission from a user gesture
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm !== 'granted') { alert('Motion permission denied — step counting will be unavailable, distance will still track via GPS.'); }
    } catch(e) {}
  }
  wkActive = true; wkStartTs = Date.now(); wkDistanceM = 0; wkSteps = 0; wkLastPos = null; wkAccelBuffer = [];
  window.addEventListener('devicemotion', handleMotionStep);
  wkWatchId = navigator.geolocation.watchPosition((pos) => {
    const { latitude, longitude, accuracy } = pos.coords;
    if (accuracy && accuracy > 40) return; // ignore very noisy fixes
    if (wkLastPos) {
      const dist = haversineMeters(wkLastPos.lat, wkLastPos.lon, latitude, longitude);
      if (dist > 0.5 && dist < 60) wkDistanceM += dist; // filter GPS jitter/jumps
    }
    wkLastPos = { lat: latitude, lon: longitude };
  }, (err) => {
    console.warn('GPS error', err.message);
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  wkTimerId = setInterval(updateWkStatsUI, 1000);
  renderLive();
}

function stopWorkout() {
  wkActive = false;
  if (wkWatchId != null) navigator.geolocation.clearWatch(wkWatchId);
  window.removeEventListener('devicemotion', handleMotionStep);
  if (wkTimerId) clearInterval(wkTimerId);
  const elapsedSec = Math.floor((Date.now() - wkStartTs)/1000);
  const miles = wkDistanceM / 1609.34;
  const mm = Math.floor(elapsedSec/60), ss = elapsedSec%60;
  const durStr = `${mm}:${String(ss).padStart(2,'0')}`;
  // Save as a real workout entry + roll into today's activity totals
  uref('workouts').push({
    name: 'Outdoor Walk', duration: durStr, date: 'Today', icon: '🚶', ts: Date.now()
  });
  uref('activity/steps').transaction(v => (v||0) + wkSteps);
  uref('activity/distance').transaction(v => Math.round(((v||0) + miles) * 100) / 100);
  uref('activity/exercise').transaction(v => (v||0) + Math.round(elapsedSec/60));
  alert(`Workout saved — ${durStr}, ${miles.toFixed(2)} mi, ${wkSteps} steps.`);
  renderLive();
}

// ---- Camera PPG heart rate ----
let hrStream = null, hrRafId = null, hrSamples = [], hrStartTs = 0, hrRunning = false;
const HR_DURATION_MS = 15000;

async function startHRMeasurement() {
  const video = document.getElementById('hrVideo');
  const hint = document.getElementById('hrHint');
  try {
    hrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) {
    alert('Camera access denied or unavailable: ' + e.message);
    return;
  }
  video.srcObject = hrStream;
  await video.play();
  const track = hrStream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) await track.applyConstraints({ advanced: [{ torch: true }] });
  } catch(e) { /* torch not supported, still works without it */ }

  hint.style.display = 'flex';
  hrSamples = []; hrStartTs = Date.now(); hrRunning = true;
  document.getElementById('hrStartBtn').disabled = true;
  document.getElementById('hrStatus').textContent = 'Measuring… hold still, cover the rear camera + flash with your fingertip.';

  const canvas = document.createElement('canvas');
  canvas.width = 40; canvas.height = 40;
  const ctx = canvas.getContext('2d');
  const waveCanvas = document.getElementById('hrWave');
  const waveCtx = waveCanvas.getContext('2d');

  function sampleFrame() {
    if (!hrRunning) return;
    const elapsed = Date.now() - hrStartTs;
    try {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let rSum = 0, n = 0;
      for (let i = 0; i < frame.length; i += 4) { rSum += frame[i]; n++; }
      const rAvg = rSum / n;
      hrSamples.push({ t: elapsed, v: rAvg });
    } catch(e) {}

    // draw waveform
    if (hrSamples.length > 2) {
      waveCtx.clearRect(0,0,waveCanvas.width, waveCanvas.height);
      const recent = hrSamples.slice(-120);
      const vals = recent.map(s=>s.v);
      const min = Math.min(...vals), max = Math.max(...vals) || min+1;
      waveCtx.strokeStyle = '#ff6b5d';
      waveCtx.lineWidth = 2;
      waveCtx.beginPath();
      recent.forEach((s, i) => {
        const x = (i/(recent.length-1)) * waveCanvas.width;
        const y = waveCanvas.height - ((s.v - min)/(max-min+0.0001)) * waveCanvas.height;
        i === 0 ? waveCtx.moveTo(x,y) : waveCtx.lineTo(x,y);
      });
      waveCtx.stroke();
    }

    if (elapsed < HR_DURATION_MS) {
      hrRafId = requestAnimationFrame(sampleFrame);
    } else {
      finishHRMeasurement();
    }
  }
  hrRafId = requestAnimationFrame(sampleFrame);
}

function finishHRMeasurement() {
  hrRunning = false;
  if (hrRafId) cancelAnimationFrame(hrRafId);
  stopHRCamera();
  const bpm = estimateBPM(hrSamples);
  document.getElementById('hrStatus').textContent = bpm ? 'Measurement complete.' : 'Could not get a clear signal — try again with steadier finger placement.';
  document.getElementById('hrStartBtn').disabled = false;
  document.getElementById('hrStartBtn').textContent = 'Measure Again';
  const resultBox = document.getElementById('hrResultBox');
  if (bpm) {
    resultBox.innerHTML = `<div class="bpm-big">${bpm}</div><div class="metric-sub">BPM (camera PPG estimate)</div>
      <button class="btn-primary" style="margin-top:12px;" onclick="saveHRReading(${bpm})">Save Reading</button>`;
  } else {
    resultBox.innerHTML = '';
  }
}

function estimateBPM(samples) {
  if (samples.length < 30) return null;
  // detrend with a moving average window
  const win = 8;
  const smoothed = samples.map((s,i) => {
    const lo = Math.max(0, i-win), hi = Math.min(samples.length, i+win);
    const seg = samples.slice(lo,hi).map(x=>x.v);
    const mean = seg.reduce((a,b)=>a+b,0)/seg.length;
    return { t: s.t, v: s.v - mean };
  });
  // peak detection with refractory period (min 320ms between beats -> max ~187bpm)
  const peaks = [];
  for (let i = 2; i < smoothed.length - 2; i++) {
    const p = smoothed[i];
    if (p.v > smoothed[i-1].v && p.v > smoothed[i+1].v && p.v > smoothed[i-2].v && p.v > smoothed[i+2].v && p.v > 1.2) {
      if (!peaks.length || (p.t - peaks[peaks.length-1]) > 320) peaks.push(p.t);
    }
  }
  if (peaks.length < 4) return null;
  const intervals = [];
  for (let i = 1; i < peaks.length; i++) intervals.push(peaks[i] - peaks[i-1]);
  intervals.sort((a,b)=>a-b);
  const mid = intervals[Math.floor(intervals.length/2)]; // median interval, robust to outliers
  const bpm = Math.round(60000 / mid);
  if (bpm < 40 || bpm > 200) return null;
  return bpm;
}

function stopHRCamera() {
  if (hrStream) { hrStream.getTracks().forEach(t => t.stop()); hrStream = null; }
  const hint = document.getElementById('hrHint');
  if (hint) hint.style.display = 'none';
}

function saveHRReading(bpm) {
  uref('heart/walkingHR').set(bpm);
  uref('heart/hrHistory').push({ bpm, ts: Date.now() });
  alert('Saved ' + bpm + ' BPM to your Heart page.');
}

  mainContent.innerHTML = `

          ${!wkActive
            ? `<button class="btn-track" onclick="startWorkout()">▶ Start Workout</button>`
            : `<button class="btn-track stop" onclick="stopWorkout()">■ Stop &amp; Save</button>`}
        </div>
        <div class="perm-note">Uses your device's GPS (Geolocation) and accelerometer (DeviceMotion). Browser will ask for location + motion permission — needs HTTPS and works best outdoors with steady phone in hand/pocket.</div>
      </div>

      <div class="card center-col">
        <div class="card-head" style="width:100%;"><div class="card-title"><span class="dot" style="background:var(--coral)"></span>Heart Rate — Camera Scan</div></div>
        <div class="hr-video-wrap" id="hrVideoWrap">
          <video id="hrVideo" muted playsinline></video>
          <div class="hr-finger-hint" id="hrHint" style="display:none;">Cover the rear camera lens gently with your fingertip</div>
        </div>
        <canvas class="waveform-canvas" id="hrWave" width="280" height="70"></canvas>
        <div id="hrStatus" class="metric-sub" style="margin-top:10px;">Tap start, then cover your phone's rear camera + flash fully with a fingertip.</div>
        <button class="btn-track" id="hrStartBtn" style="margin-top:14px;" onclick="startHRMeasurement()">▶ Start 15s Measurement</button>
        <div id="hrResultBox"></div>
        <div class="perm-note">Uses the rear camera to detect blood-flow color changes in your fingertip (photoplethysmography) — the same principle Apple Watch/Fitbit optical sensors use. This is an estimate, not a medical device.</div>
      </div>
    </div>
  `;
  if (wkActive) updateWkStatsUI();
}
</script>
